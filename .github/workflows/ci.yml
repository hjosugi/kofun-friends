name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  issue-automation:
    name: test issue automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  converter:
    name: build & lint converter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/converter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/converter
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

  dist-reproducible:
    name: dist is reproducible from assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/converter
      - name: Regenerate dist/
        run: bash scripts/regen.sh
      - name: Fail if dist/ drifted from committed output
        run: |
          # These two large board contact sheets are SVG rasterizations that can
          # vary by runner renderer/PNG encoder. Keep the reproducibility gate
          # strict for all other distributable assets.
          DIST_STATUS="$(git status --porcelain -- dist \
            ':(exclude)dist/backgrounds/background-board.png' \
            ':(exclude)dist/backgrounds/background-board-mascots.png')"
          if [ -n "$DIST_STATUS" ]; then
            echo "::error::dist/ is out of date — run scripts/regen.sh and commit."
            git --no-pager diff --stat -- dist \
              ':(exclude)dist/backgrounds/background-board.png' \
              ':(exclude)dist/backgrounds/background-board-mascots.png'
            exit 1
          fi
